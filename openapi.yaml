openapi: 3.1.0
info:
  title: pr-lens-demo API
  version: 1.0.0
  description: |
    Public API for the demo SaaS project-management application. Used as a
    reference repository by PR Lens to exercise its API-change pillar.
servers:
  - url: https://pr-lens-demo.vercel.app
    description: Production
  - url: http://localhost:3000
    description: Local development
tags:
  - name: workspaces
  - name: tasks
  - name: memberships
  - name: billing
  - name: legacy
    description: |
      Token-authenticated read-only public API. Deprecated and scheduled
      for removal — see `/developers/legacy`.

paths:
  /api/v0/workspaces:
    get:
      tags: [legacy]
      summary: List the calling token's workspace (legacy v0)
      operationId: legacyListWorkspaces
      deprecated: true
      parameters:
        - name: x-api-token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A single-item array with the workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegacyWorkspace"

  /api/v0/tasks:
    get:
      tags: [legacy]
      summary: List tasks in the calling token's workspace (legacy v0)
      operationId: legacyListTasks
      deprecated: true
      parameters:
        - name: x-api-token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tasks in the workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegacyTask"

  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: List workspaces visible to the caller
      operationId: listWorkspaces
      responses:
        "200":
          description: A list of workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
    post:
      tags: [workspaces]
      summary: Create a new workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /api/v1/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [workspaces]
      summary: Get a workspace by id
      operationId: getWorkspace
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: Workspace not found

  /api/v1/workspaces/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [memberships]
      summary: List members of a workspace
      operationId: listWorkspaceMembers
      responses:
        "200":
          description: Members of the workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Membership"

  /api/v1/workspaces/{id}/subscription:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [billing]
      summary: Get the current subscription for a workspace
      operationId: getSubscription
      responses:
        "200":
          description: The active subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: No subscription found for this workspace

  /api/v1/workspaces/{id}/usage:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: period
        in: query
        required: false
        description: ISO month string (YYYY-MM). Defaults to the current month.
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
    get:
      tags: [billing]
      summary: Get usage summary for the workspace's current period
      operationId: getUsageSummary
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"

  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: List tasks, optionally filtered by workspace
      operationId: listTasks
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A list of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
    post:
      tags: [tasks]
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, title]
              properties:
                workspaceId: { type: string }
                title: { type: string }
                description: { type: string }
                priority:
                  type: string
                  enum: [none, low, medium, high, urgent]
                assigneeId: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [tasks]
      summary: Get a task by id
      operationId: getTask
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      tags: [tasks]
      summary: Update a task
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                status:
                  type: string
                  enum: [todo, in_progress, done, archived]
                assigneeId: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

components:
  schemas:
    LegacyWorkspace:
      type: object
      required: [id, slug, name, plan]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        plan: { type: string }
    LegacyTask:
      type: object
      required: [id, workspaceId, title, status]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        title: { type: string }
        status: { type: string }
        assigneeId: { type: string, nullable: true }
    Workspace:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }
    Membership:
      type: object
      required: [id, userId, workspaceId, role]
      properties:
        id: { type: string }
        userId: { type: string }
        workspaceId: { type: string }
        role:
          type: string
          enum: [owner, admin, member, viewer]
    Subscription:
      type: object
      required: [id, workspaceId, status, includedAICredits, overageRateCents, currentPeriodEnd]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        status:
          type: string
          enum: [trialing, active, past_due, canceled]
        includedAICredits: { type: integer }
        overageRateCents: { type: integer }
        currentPeriodEnd: { type: string, format: date-time }
    UsageSummary:
      type: object
      required: [workspaceId, period, unitsUsed, includedUnits, overageUnits, overageCostCents]
      properties:
        workspaceId: { type: string }
        period: { type: string, description: "ISO month (YYYY-MM)" }
        unitsUsed: { type: integer }
        includedUnits: { type: integer }
        overageUnits: { type: integer }
        overageCostCents: { type: integer }
    Task:
      type: object
      required: [id, workspaceId, title, status, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [todo, in_progress, done, archived]
        priority:
          type: string
          enum: [none, low, medium, high, urgent]
          nullable: true
        assigneeId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
